# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: medisync-ai
    runtime: docker
    plan: free
    region: singapore
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: medisync_ai
      - key: MONGODB_ALLOW_MOCK
        value: "false"
      - key: MONGODB_TIMEOUT_MS
        value: "10000"
      - key: DEMO_OPERATOR_TOKEN
        generateValue: true
      - key: SIMULATION_TICK_SECONDS
        value: "3"
      - key: SIMULATION_MINUTES_PER_REAL_SECOND
        value: "1"
